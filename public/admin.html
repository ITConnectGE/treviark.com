<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel - Philosophy Editor</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
      }
      .login-container {
        max-width: 400px;
        margin: 100px auto;
        background: white;
        padding: 40px;
        border-radius: 10px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      }
      .admin-container {
        background: white;
        border-radius: 10px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        padding: 30px;
        margin-top: 20px;
      }
      h1 {
        color: #667eea;
        margin-bottom: 30px;
        text-align: center;
      }
      h2 {
        color: #333;
        margin-bottom: 20px;
      }
      .form-group {
        margin-bottom: 20px;
      }
      label {
        display: block;
        margin-bottom: 8px;
        color: #555;
        font-weight: 500;
      }
      input[type="text"],
      input[type="password"],
      textarea {
        width: 100%;
        padding: 12px;
        border: 2px solid #e0e0e0;
        border-radius: 6px;
        font-size: 16px;
        font-family: inherit;
        transition: border-color 0.3s;
      }
      input:focus,
      textarea:focus {
        outline: none;
        border-color: #667eea;
      }
      textarea {
        min-height: 120px;
        resize: vertical;
      }
      button {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        padding: 12px 30px;
        border-radius: 6px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
      }
      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
      }
      button:active {
        transform: translateY(0);
      }
      .btn-primary {
        width: 100%;
        margin-top: 10px;
      }
      .btn-danger {
        background: #e74c3c;
        margin-left: 10px;
      }
      .btn-danger:hover {
        box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4);
      }
      .section-editor {
        background: #f8f9fa;
        padding: 20px;
        border-radius: 8px;
        margin-bottom: 20px;
        border: 2px solid #e0e0e0;
      }
      .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
      }
      .add-section-btn {
        background: #27ae60;
        margin-bottom: 20px;
      }
      .add-section-btn:hover {
        box-shadow: 0 5px 15px rgba(39, 174, 96, 0.4);
      }
      .status-message {
        padding: 12px;
        border-radius: 6px;
        margin-bottom: 20px;
        text-align: center;
        font-weight: 500;
      }
      .status-success {
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }
      .status-error {
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }
      .header-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
        padding-bottom: 20px;
        border-bottom: 2px solid #e0e0e0;
      }
      .user-info {
        color: #666;
      }
      .logout-btn {
        background: #e74c3c;
        padding: 8px 20px;
        font-size: 14px;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- Login Form -->
    <div id="loginContainer" class="login-container">
      <h1>Admin Login</h1>
      <div id="loginMessage" class="status-message hidden"></div>
      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required />
        </div>
        <button type="submit" class="btn-primary">Login</button>
      </form>
    </div>

    <!-- Admin Panel -->
    <div id="adminContainer" class="container hidden">
      <div class="admin-container">
        <div class="header-bar">
          <h1>Philosophy Page Editor</h1>
          <div>
            <span class="user-info"
              >Logged in as: <strong id="currentUser"></strong
            ></span>
            <button class="logout-btn" onclick="logout()">Logout</button>
          </div>
        </div>

        <div id="statusMessage" class="status-message hidden"></div>

        <form id="philosophyForm">
          <div class="form-group">
            <label for="pageTitle">Page Title</label>
            <input type="text" id="pageTitle" required />
          </div>

          <h2>Page Sections</h2>
          <div id="sectionsContainer"></div>

          <button type="button" class="add-section-btn" onclick="addSection()">
            + Add New Section
          </button>

          <button type="submit" class="btn-primary">Save Changes</button>
        </form>
      </div>
    </div>

    <script>
      let authToken = localStorage.getItem("authToken");
      let currentData = null;

      // Check if user is already logged in
      if (authToken) {
        loadContent();
      } else {
        document.getElementById("loginContainer").classList.remove("hidden");
      }

      // Login form handler
      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const username = document.getElementById("username").value;
          const password = document.getElementById("password").value;

          try {
            const response = await fetch("/api/login", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ username, password }),
            });

            const data = await response.json();

            if (response.ok) {
              authToken = data.token;
              localStorage.setItem("authToken", authToken);
              document.getElementById("currentUser").textContent =
                data.username;
              document.getElementById("loginContainer").classList.add("hidden");
              document
                .getElementById("adminContainer")
                .classList.remove("hidden");
              loadContent();
            } else {
              showMessage(
                "loginMessage",
                data.error || "Login failed",
                "error"
              );
            }
          } catch (error) {
            showMessage(
              "loginMessage",
              "Network error. Please try again.",
              "error"
            );
          }
        });

      // Load content from server
      async function loadContent() {
        try {
          const response = await fetch("/api/philosophy", {
            headers: {
              Authorization: `Bearer ${authToken}`,
            },
          });

          if (response.status === 401) {
            logout();
            return;
          }

          currentData = await response.json();
          populateForm(currentData);
        } catch (error) {
          console.error("Error loading content:", error);
          showMessage("statusMessage", "Error loading content", "error");
        }
      }

      // Populate form with data
      function populateForm(data) {
        document.getElementById("pageTitle").value = data.title || "";

        const sectionsContainer = document.getElementById("sectionsContainer");
        sectionsContainer.innerHTML = "";

        if (data.sections && data.sections.length > 0) {
          data.sections.forEach((section, index) => {
            addSectionEditor(section, index);
          });
        } else {
          addSectionEditor();
        }
      }

      // Add section editor
      function addSectionEditor(section = null, index = null) {
        const sectionsContainer = document.getElementById("sectionsContainer");
        const sectionDiv = document.createElement("div");
        sectionDiv.className = "section-editor";
        sectionDiv.dataset.index =
          index !== null ? index : sectionsContainer.children.length;

        const sectionId = section?.id || `section${Date.now()}`;

        sectionDiv.innerHTML = `
                <div class="section-header">
                    <h3>Section ${
                      (index !== null
                        ? index
                        : sectionsContainer.children.length) + 1
                    }</h3>
                    <button type="button" class="btn-danger" onclick="removeSection(this)">Remove</button>
                </div>
                <input type="hidden" class="section-id" value="${sectionId}">
                <div class="form-group">
                    <label>Heading</label>
                    <input type="text" class="section-heading" value="${
                      section?.heading || ""
                    }" required>
                </div>
                <div class="form-group">
                    <label>Content</label>
                    <textarea class="section-content" required>${
                      section?.content || ""
                    }</textarea>
                </div>
            `;

        sectionsContainer.appendChild(sectionDiv);
      }

      // Add new section
      function addSection() {
        addSectionEditor();
      }

      // Remove section
      function removeSection(button) {
        if (document.querySelectorAll(".section-editor").length > 1) {
          button.closest(".section-editor").remove();
          updateSectionNumbers();
        } else {
          alert("You must have at least one section.");
        }
      }

      // Update section numbers
      function updateSectionNumbers() {
        document
          .querySelectorAll(".section-editor")
          .forEach((section, index) => {
            section.querySelector("h3").textContent = `Section ${index + 1}`;
          });
      }

      // Save form handler
      document
        .getElementById("philosophyForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const sections = [];
          document.querySelectorAll(".section-editor").forEach((sectionDiv) => {
            sections.push({
              id: sectionDiv.querySelector(".section-id").value,
              heading: sectionDiv.querySelector(".section-heading").value,
              content: sectionDiv.querySelector(".section-content").value,
            });
          });

          const data = {
            title: document.getElementById("pageTitle").value,
            sections: sections,
          };

          try {
            const response = await fetch("/api/philosophy", {
              method: "PUT",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${authToken}`,
              },
              body: JSON.stringify(data),
            });

            if (response.status === 401) {
              logout();
              return;
            }

            const result = await response.json();

            if (response.ok) {
              showMessage(
                "statusMessage",
                "Content saved successfully!",
                "success"
              );
              currentData = result.data;
            } else {
              showMessage(
                "statusMessage",
                result.error || "Error saving content",
                "error"
              );
            }
          } catch (error) {
            console.error("Error saving content:", error);
            showMessage(
              "statusMessage",
              "Network error. Please try again.",
              "error"
            );
          }
        });

      // Show message
      function showMessage(elementId, message, type) {
        const element = document.getElementById(elementId);
        element.textContent = message;
        element.className = `status-message status-${type}`;
        element.classList.remove("hidden");

        if (type === "success") {
          setTimeout(() => {
            element.classList.add("hidden");
          }, 3000);
        }
      }

      // Logout
      function logout() {
        localStorage.removeItem("authToken");
        authToken = null;
        document.getElementById("loginContainer").classList.remove("hidden");
        document.getElementById("adminContainer").classList.add("hidden");
        document.getElementById("loginForm").reset();
      }
    </script>
  </body>
</html>
